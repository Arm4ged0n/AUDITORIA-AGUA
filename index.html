<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaAudit - Auditoria e Projeção</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --digit-black: #111111;
            --digit-red: #991b1b;
        }
        body {
            background-color: var(--bg-dark);
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .meter-display {
            display: flex;
            gap: 4px;
            background: #222;
            padding: 12px;
            border-radius: 12px;
            border: 4px solid #444;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
            width: fit-content;
        }
        .digit {
            width: 42px;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.2rem;
            font-weight: 900;
            color: white;
            border-radius: 4px;
        }
        .digit-black { background: var(--digit-black); border-bottom: 3px solid #000; }
        .digit-red { background: var(--digit-red); border-bottom: 3px solid #7f1d1d; }
        
        .comma {
            display: flex;
            align-items: flex-end;
            padding-bottom: 10px;
            font-size: 2.5rem;
            color: #ef4444;
            font-weight: bold;
        }
        .tank-container {
            width: 60px;
            height: 100px;
            background: #020617;
            border: 3px solid #334155;
            border-radius: 8px 8px 15px 15px;
            position: relative;
            overflow: hidden;
        }
        .water-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to top, #0ea5e9, #38bdf8);
            transition: height 0.5s ease-in-out;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-black text-sky-400 italic">AQUAAUDIT 2.0</h1>
            <p class="text-slate-400 text-xs uppercase tracking-widest mt-2">Gestão de Consumo e Projeção Financeira</p>
        </header>

        <!-- CONFIGURAÇÃO INICIAL DO CICLO -->
        <div class="bg-slate-800/50 p-6 rounded-3xl border border-slate-700 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-end">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Leitura Base Fatura (6 dígitos)</label>
                    <input type="number" id="baseInput" value="29700" class="w-full bg-slate-900 text-white text-2xl font-mono p-2 rounded-lg border border-slate-600 outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Data da Leitura CORSAN</label>
                    <input type="date" id="baseDate" value="2026-03-03" class="w-full bg-slate-900 text-white p-3 rounded-lg border border-slate-600 outline-none focus:border-sky-500">
                </div>
                <button onclick="clearHistory()" class="bg-red-900/20 hover:bg-red-900/40 text-red-400 text-[10px] font-black p-4 rounded-xl border border-red-900/50 uppercase">
                    Reiniciar Novo Período
                </button>
            </div>
        </div>

        <!-- DASHBOARD PRINCIPAL -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 mb-8">
            <!-- HIDRÔMETRO -->
            <div class="lg:col-span-2 bg-slate-800/30 p-6 rounded-[32px] border border-sky-500/20 flex flex-col items-center">
                <span class="text-[10px] font-black text-sky-400 uppercase mb-4">Visor Atual</span>
                <div class="meter-display" id="mainMeter"></div>
                <div id="lastUpdate" class="text-[9px] text-slate-500 mt-4 font-bold uppercase tracking-widest text-center">---</div>
            </div>

            <!-- MÉDIA E PROJEÇÃO -->
            <div class="bg-slate-800 p-6 rounded-[32px] border border-slate-700 flex flex-col justify-center text-center">
                <span class="text-[10px] text-emerald-400 font-bold uppercase mb-1">Média Diária</span>
                <div class="text-4xl font-black text-white" id="statMedia">0</div>
                <div class="text-[10px] text-slate-500 font-bold uppercase mt-1">Litros / Dia</div>
            </div>

            <div class="bg-slate-800 p-6 rounded-[32px] border border-emerald-500/30 flex flex-col justify-center text-center">
                <span class="text-[10px] text-emerald-400 font-bold uppercase mb-1">Projeção Próxima Fatura</span>
                <div class="text-3xl font-black text-white">R$ <span id="valFatura">0,00</span></div>
                <div class="text-[9px] text-slate-500 font-bold uppercase mt-1">Taxa Fixa + Consumo</div>
            </div>
        </div>

        <!-- PAINEL DE ÁGUA -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 text-center">
                <h3 class="text-[10px] text-slate-400 uppercase font-bold mb-2">Acumulado do Mês</h3>
                <div class="text-4xl font-black text-white" id="statLitros">0</div>
                <div class="text-[10px] text-sky-500 font-bold uppercase mt-1">Litros Totais</div>
            </div>
            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 text-center flex flex-col items-center">
                <h3 class="text-[10px] text-slate-400 uppercase font-bold mb-2">Ciclos de 100L</h3>
                <div class="text-5xl font-black text-amber-400" id="statCiclos">0</div>
                <div class="text-[10px] text-amber-600 font-bold uppercase mt-1">Boias Completas</div>
            </div>
            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 flex items-center justify-around">
                <div class="tank-container">
                    <div id="waterLevel" class="water-fill" style="height: 0%"></div>
                </div>
                <div class="text-right">
                    <div class="text-2xl font-black text-white" id="statM3">0</div>
                    <div class="text-[9px] text-slate-500 uppercase font-bold">m³ Consumidos</div>
                </div>
            </div>
        </div>

        <!-- ENTRADA -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-slate-900/50 p-6 rounded-3xl border border-slate-700 h-fit">
                <h2 class="text-xs font-black text-slate-400 uppercase mb-4 tracking-widest">Nova Medição</h2>
                <input type="number" id="readingInput" placeholder="Ex: 29862" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 text-white font-mono text-xl outline-none mb-4">
                <button onclick="addReading()" class="w-full bg-sky-600 hover:bg-sky-500 text-white py-4 rounded-xl font-black text-xs uppercase transition-all">Registar Agora</button>
            </div>

            <div class="lg:col-span-2 bg-slate-800/20 rounded-3xl border border-slate-700 overflow-hidden">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-900/50 text-[9px] text-slate-500 uppercase tracking-widest">
                        <tr>
                            <th class="p-4">Data/Hora</th>
                            <th class="p-4">Leitura</th>
                            <th class="p-4">Consumo</th>
                            <th class="p-4 text-center">Remover</th>
                        </tr>
                    </thead>
                    <tbody id="historyTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Dados da CORSAN baseados na sua fatura
        const TAXA_BASICA = 39.32;
        const CUSTO_POR_M3 = 8.28; // Média da fatura de ontem (124,20 / 15m3)
        
        const DB_KEY = 'aqua_audit_v2_fatura';
        let state = {
            baseValue: 29700,
            baseDate: '2026-03-03',
            history: []
        };

        function init() {
            const saved = localStorage.getItem(DB_KEY);
            if(saved) {
                state = JSON.parse(saved);
                document.getElementById('baseInput').value = state.baseValue;
                document.getElementById('baseDate').value = state.baseDate;
            } else {
                state.history = [{ id: Date.now(), val: 29862, time: new Date().toLocaleString('pt-BR'), dateObj: new Date().toISOString() }];
                save();
            }
            render();
        }

        function save() {
            state.baseValue = parseInt(document.getElementById('baseInput').value) || 0;
            state.baseDate = document.getElementById('baseDate').value;
            localStorage.setItem(DB_KEY, JSON.stringify(state));
            render();
        }

        function clearHistory() {
            if(confirm("Deseja iniciar um novo ciclo de fatura? Isso zerará as medições atuais.")) {
                state.history = [];
                save();
            }
        }

        function addReading() {
            const input = document.getElementById('readingInput');
            const val = parseInt(input.value);
            if(!val) return;
            
            const now = new Date();
            state.history.push({
                id: Date.now(),
                val: val,
                time: now.toLocaleString('pt-BR'),
                dateObj: now.toISOString()
            });
            input.value = '';
            save();
        }

        function removeEntry(id) {
            state.history = state.history.filter(i => i.id !== id);
            save();
        }

        function render() {
            const sorted = [...state.history].sort((a,b) => a.id - b.id);
            const lastEntry = sorted[sorted.length - 1] || { val: state.baseValue, time: 'Sem dados', dateObj: new Date().toISOString() };

            // Render Hidrômetro
            const meter = document.getElementById('mainMeter');
            const sVal = lastEntry.val.toString().padStart(6, '0');
            meter.innerHTML = '';
            for(let i=0; i<6; i++) {
                if(i === 4) meter.innerHTML += '<div class="comma">,</div>';
                const d = document.createElement('div');
                d.className = i < 4 ? 'digit digit-black' : 'digit digit-red';
                d.innerText = sVal[i];
                meter.appendChild(d);
            }
            document.getElementById('lastUpdate').innerText = `Atualizado: ${lastEntry.time}`;

            // Cálculos
            const totalLitros = Math.max(0, lastEntry.val - state.baseValue);
            const numCiclos = Math.floor(totalLitros / 100);
            const litrosTanque = totalLitros % 100;
            const m3Consumidos = totalLitros / 1000;

            // Média Diária
            const dataBase = new Date(state.baseDate + 'T00:00:00');
            const dataUltima = new Date(lastEntry.dateObj);
            const diffTempo = Math.max(1000 * 60 * 60 * 24, dataUltima - dataBase); // Mínimo 1 dia para evitar divisão por zero
            const diasDecorridos = diffTempo / (1000 * 60 * 60 * 24);
            const mediaDiaria = totalLitros / diasDecorridos;

            // Projeção Financeira
            // CORSAN cobra m3 cheio (teto)
            const m3Faturaveis = Math.ceil(m3Consumidos);
            const valorProjetado = TAXA_BASICA + (m3Faturaveis * CUSTO_POR_M3);

            // Atualiza UI
            document.getElementById('statLitros').innerText = totalLitros.toLocaleString('pt-BR');
            document.getElementById('statCiclos').innerText = numCiclos;
            document.getElementById('statM3').innerText = m3Consumidos.toFixed(3);
            document.getElementById('statMedia').innerText = Math.round(mediaDiaria);
            document.getElementById('valFatura').innerText = valorProjetado.toLocaleString('pt-BR', {minimumFractionDigits: 2});
            document.getElementById('waterLevel').style.height = `${litrosTanque}%`;

            // Tabela
            const table = document.getElementById('historyTable');
            table.innerHTML = '';
            [...sorted].reverse().forEach(entry => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-slate-700/50 hover:bg-white/5";
                tr.innerHTML = `
                    <td class="p-4 text-slate-400 font-medium">${entry.time}</td>
                    <td class="p-4 font-mono font-bold text-sky-400">${entry.val}</td>
                    <td class="p-4 text-emerald-400 font-bold">${entry.val - state.baseValue} L</td>
                    <td class="p-4 text-center">
                        <button onclick="removeEntry(${entry.id})" class="text-red-500/50 hover:text-red-500 font-bold">×</button>
                    </td>
                `;
                table.appendChild(tr);
            });
        }

        document.getElementById('baseInput').onchange = save;
        document.getElementById('baseDate').onchange = save;
        window.onload = init;
    </script>
</body>
</html>
