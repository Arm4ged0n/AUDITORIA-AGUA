<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Água CORSAN</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #020617; 
            color: #f1f5f9;
            background-image: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
            min-height: 100vh;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .neon-text-blue { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); color: #60a5fa; }
        .card-highlight {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.1) 0%, rgba(15, 23, 42, 0.9) 100%);
            border: 1px solid rgba(37, 99, 235, 0.2);
        }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const App = () => {
            // MARCOS ESTABELECIDOS POR SANDRO
            const DATA_INICIO = new Date('2026-02-05T00:00:00'); 
            const LEITURA_INICIAL_CORSAN = 28.282; 
            const LITROS_POR_CICLO = 100;
            const TAXA_FIXA_SERVICO = 39.32; 
            const PRECO_POR_M3 = 193.78 / 22;

            const [historico, setHistorico] = useState(() => {
                const salvo = localStorage.getItem('monitor_corsan_v1');
                return salvo ? JSON.parse(salvo) : [
                    { id: 1, valor: 29.007, timestamp: new Date('2026-02-17T19:00:00').getTime() }
                ];
            });

            const [input, setInput] = useState('');

            useEffect(() => {
                localStorage.setItem('monitor_corsan_v1', JSON.stringify(historico));
            }, [historico]);

            const metrics = useMemo(() => {
                const sorted = [...historico].sort((a, b) => b.timestamp - a.timestamp);
                const leituraAtualManual = sorted.length > 0 ? sorted[0].valor : LEITURA_INICIAL_CORSAN;
                
                const diffM3 = Math.max(0, leituraAtualManual - LEITURA_INICIAL_CORSAN);
                const totalLitros = Math.round(diffM3 * 1000);
                
                const numCiclos = Math.floor(totalLitros / LITROS_POR_CICLO);
                const litrosRestantes = totalLitros % LITROS_POR_CICLO;

                const hoje = Date.now();
                const tempoTotalMs = hoje - DATA_INICIO.getTime();
                const diasDecorridos = Math.max(1, tempoTotalMs / (1000 * 60 * 60 * 24));
                const mediaDiariaL = totalLitros / diasDecorridos;
                
                const consumoProjetadoM3 = (mediaDiariaL * 30) / 1000;
                const custoProjetado = TAXA_FIXA_SERVICO + (consumoProjetadoM3 * PRECO_POR_M3);

                return { 
                    leituraAtualManual, totalLitros, diffM3, 
                    numCiclos, litrosRestantes, mediaDiariaL, 
                    custoProjetado, sorted, diasDecorridos
                };
            }, [historico]);

            const adicionar = () => {
                const val = parseFloat(input.replace(',', '.'));
                if (!isNaN(val)) {
                    setHistorico([{ id: Date.now(), valor: val, timestamp: Date.now() }, ...historico]);
                    setInput('');
                }
            };

            const remover = (id) => setHistorico(historico.filter(h => h.id !== id));

            return (
                <div className="max-w-5xl mx-auto p-4 md:p-8 space-y-6">
                    
                    {/* TOPO COM NOME DA PLATAFORMA */}
                    <div className="flex flex-col items-center mb-8 text-center">
                        <div className="bg-blue-500/10 px-4 py-1 rounded-full border border-blue-500/20 mb-2">
                            <span className="text-blue-400 text-[10px] font-black tracking-[0.2em] uppercase">Auditoria de Consumo</span>
                        </div>
                        <h1 className="text-4xl md:text-5xl font-black text-white tracking-tighter italic">
                            Monitor Água <span className="text-blue-500 not-italic">CORSAN</span>
                        </h1>
                        <div className="h-1 w-32 bg-blue-600 rounded-full mt-3 shadow-[0_0_15px_#2563eb]"></div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="glass p-6 rounded-3xl border-l-4 border-l-slate-700 shadow-lg">
                            <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Ponto Zero (05/02)</p>
                            <p className="text-3xl md:text-4xl font-mono font-black text-slate-300">{LEITURA_INICIAL_CORSAN.toFixed(3)} <span className="text-sm font-normal text-slate-600 uppercase">m³</span></p>
                        </div>
                        <div className="glass p-6 rounded-3xl border-l-4 border-l-blue-500 shadow-xl shadow-blue-900/10">
                            <p className="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-1">Última Leitura Capturada</p>
                            <p className="text-3xl md:text-4xl font-mono font-black neon-text-blue">{metrics.leituraAtualManual.toFixed(3)} <span className="text-sm font-normal text-blue-900 uppercase">m³</span></p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="card-highlight p-6 rounded-3xl relative overflow-hidden group">
                            <p className="text-[10px] font-black text-blue-400 uppercase mb-3 tracking-wider">Ciclos de 100 Litros</p>
                            <div className="flex flex-col">
                                <span className="text-5xl font-black text-white italic">{metrics.numCiclos} <small className="text-sm font-bold uppercase not-italic text-blue-400">Ciclos</small></span>
                                <span className="text-2xl font-mono font-bold text-slate-500">+ {metrics.litrosRestantes} Litros</span>
                            </div>
                            <div className="mt-4 h-3 w-full bg-slate-800 rounded-full overflow-hidden border border-white/5">
                                <div className="h-full bg-blue-500 shadow-[0_0_15px_#3b82f6] transition-all duration-700" style={{width: `${metrics.litrosRestantes}%`}}></div>
                            </div>
                        </div>

                        <div className="glass p-6 rounded-3xl border border-white/5 flex flex-col justify-center">
                            <p className="text-[10px] font-bold text-slate-500 uppercase mb-3">Consumo Total</p>
                            <div className="flex items-baseline gap-2">
                                <span className="text-4xl font-mono font-black text-white">{metrics.totalLitros}</span>
                                <span className="text-sm font-bold text-slate-500 uppercase">Litros</span>
                            </div>
                            {/* ADICIONADO: Visualização em m3 para facilitar auditoria */}
                            <div className="mt-1 flex items-baseline gap-1 opacity-80">
                                <span className="text-xl font-mono font-bold text-blue-400">{metrics.diffM3.toFixed(3)}</span>
                                <span className="text-[10px] font-bold text-slate-500 uppercase">m³ acumulados</span>
                            </div>
                            <p className="text-[10px] text-slate-600 mt-2 uppercase font-bold tracking-tight">Período: {Math.floor(metrics.diasDecorridos)} dias</p>
                        </div>

                        <div className="glass p-6 rounded-3xl border border-blue-500/20 bg-blue-500/5 flex flex-col justify-center">
                            <p className="text-[10px] font-black text-blue-400 uppercase mb-3 text-center md:text-left">Projeção da Fatura</p>
                            <div className="flex items-baseline gap-1 justify-center md:justify-start">
                                <span className="text-sm font-bold text-blue-400">R$</span>
                                <span className="text-4xl font-mono font-black text-white">{metrics.custoProjetado.toFixed(2)}</span>
                            </div>
                            <p className="text-[9px] text-slate-500 mt-2 uppercase mono text-center md:text-left">Referente a ciclo de 30 dias</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-5 gap-6">
                        <div className="lg:col-span-2 glass p-8 rounded-3xl space-y-6 flex flex-col justify-center border-t border-white/10 shadow-2xl">
                            <h3 className="text-xs font-black uppercase tracking-widest text-white flex items-center gap-2">
                                <span className="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></span>
                                Registrar Novo Valor
                            </h3>
                            <div className="space-y-4">
                                <input 
                                    type="number" 
                                    step="0.001"
                                    value={input}
                                    onChange={e => setInput(e.target.value)}
                                    placeholder="Ex: 29.007"
                                    className="w-full bg-slate-950 border border-white/10 rounded-2xl p-6 text-4xl font-mono font-bold outline-none focus:border-blue-500 text-center text-blue-400 placeholder:text-slate-800 shadow-inner"
                                />
                                <button 
                                    onClick={adicionar}
                                    className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-5 rounded-2xl uppercase text-xs tracking-widest transition-all shadow-lg active:scale-95"
                                >
                                    Gravar Medição
                                </button>
                            </div>
                        </div>

                        <div className="lg:col-span-3 glass rounded-3xl overflow-hidden shadow-2xl flex flex-col border border-white/5">
                            <div className="p-4 bg-white/5 border-b border-white/5 flex justify-between items-center">
                                <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-500">Histórico de Conferência</h3>
                                <span className="text-[9px] text-blue-900 font-bold uppercase mono bg-blue-400/10 px-2 py-0.5 rounded">ID: CORSAN_AQUARIUS</span>
                            </div>
                            <div className="max-h-[350px] overflow-y-auto custom-scroll">
                                <table className="w-full text-left text-sm border-collapse">
                                    <thead className="text-[9px] font-bold uppercase text-slate-600 mono bg-slate-950/90 sticky top-0 z-10">
                                        <tr>
                                            <th className="p-4 border-b border-white/5">Data</th>
                                            <th className="p-4 border-b border-white/5">m³</th>
                                            <th className="p-4 text-center border-b border-white/5">Consumo</th>
                                            <th className="p-4 text-right border-b border-white/5">Remover</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-white/5">
                                        {metrics.sorted.map((item, idx) => {
                                            const prev = metrics.sorted[idx + 1]?.valor || LEITURA_INICIAL_CORSAN;
                                            const diff = Math.round((item.valor - prev) * 1000);
                                            return (
                                                <tr key={item.id} className="hover:bg-blue-500/5 transition-colors group">
                                                    <td className="p-4">
                                                        <div className="font-bold text-slate-300 text-xs">{new Date(item.timestamp).toLocaleDateString('pt-BR')}</div>
                                                        <div className="text-[10px] text-slate-600">{new Date(item.timestamp).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}</div>
                                                    </td>
                                                    <td className="p-4 font-mono font-bold text-white italic">{item.valor.toFixed(3)}</td>
                                                    <td className="p-4 text-center">
                                                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${diff > 0 ? 'bg-blue-500/10 text-blue-400 border border-blue-500/20' : 'bg-slate-800 text-slate-500'}`}>
                                                            {diff > 0 ? `+${diff}L` : `BASE`}
                                                        </span>
                                                    </td>
                                                    <td className="p-4 text-right">
                                                        <button 
                                                            onClick={() => remover(item.id)} 
                                                            className="p-2 text-slate-700 hover:text-red-500 transition-colors opacity-30 group-hover:opacity-100"
                                                            title="Remover erro"
                                                        >
                                                            <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                                                                <path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" strokeLinecap="round" strokeLinejoin="round"/>
                                                            </svg>
                                                        </button>
                                                    </td>
                                                </tr>
                                            )
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
